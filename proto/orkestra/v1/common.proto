syntax = "proto3";

package orkestra.v1;

option go_package = "github.com/heckertobias/orkestra/internal/shared/gen/orkestra/v1;orkestraV1";

// Empty placeholder used before google/protobuf/empty.proto is imported.
message Empty {}

// A single service's failure inside one stack reconcile. Shared between the Agent stream
// (StackStatus.service_errors) and the UI API (StackState.service_errors).
message ServiceError {
  string service_name = 1;
  string error        = 2;
}
